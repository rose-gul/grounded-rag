services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  # Uncomment to run the API in a container instead of `make api`.
  # api:
  #   build: .
  #   ports: ["8000:8000"]
  #   env_file: .env
  #   depends_on: [qdrant]
  #   environment:
  #     QDRANT_URL: http://qdrant:6333

volumes:
  qdrant_data:
