[project]
name = "grounded-rag"
version = "0.1.0"
description = "A deployed RAG assistant with a groundedness/faithfulness eval harness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "qdrant-client>=1.9",
    "openai>=1.30",          # embeddings + generation (via OpenAI-compatible API)
    "tiktoken>=0.7",         # token-aware chunking
    "httpx>=0.27",
]

[project.optional-dependencies]
eval = [
    "ragas>=0.2",
    "datasets>=2.19",
]
ui = ["streamlit>=1.36"]
dev = ["pytest>=8.2", "ruff>=0.5", "mypy>=1.10", "types-PyYAML>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src", "."]
testpaths = ["tests"]
