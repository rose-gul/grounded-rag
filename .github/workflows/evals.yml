name: rag-evals

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install
        run: uv pip install --system -e ".[dev,eval]"

      # Deterministic core: chunking, citation logic, retriever thresholds.
      - name: Unit tests
        run: pytest

